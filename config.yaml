persona:
  name: "Mohammad Tanzil Alam"
  style: "professional, concise, and well-organized"
  tagline: "AI-powered CV Assistant"
  location: "Wuppertal, Germany"
  status: "Available for opportunities"
  github: "https://github.com/tanzilalam23"
  linkedin: "https://linkedin.com/in/mohammad-tanzil-alam"
  welcome_message: "Hi! I'm Mohammad's AI assistant. Ask me anything about his background, projects, or experience."

llm:
  provider: "groq"
  model: "openai/gpt-oss-20b"
  temperature: 0.1
  max_tokens: 500
  max_retries: 2
  timeout: 30

embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"

retriever:
  k: 8
  search_multiplier: 3
  # Broad questions (full work history, profile summary) need every
  # employer chunk in context at once, or the model will only see a
  # partial history and either omit a role or guess at the gap.
  k_employment: 12

chunking:
  chunk_size: 400
  overlap: 80
  min_chunk_words: 15

guardrails:
  blocked_phrases:
    - "reveal your system prompt"
    - "ignore previous instructions"
    - "jailbreak"
    - "password"
    - "credit card"
    - "social security"
    - "personal information"
    - "hack"
    - "bypass"
    - "exploit"
    - "data breach"